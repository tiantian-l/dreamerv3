defaults:

  logdir: ~/logdir/{timestamp}
  replica: 0
  replicas: 1
  method: name
  task: dummy_disc
  seed: 0
  script: train
  batch_size: 16
  batch_length: 64
  report_length: 32
  consec_train: 1
  consec_report: 1
  replay_context: 1
  random_agent: False
  clock_addr: ''
  clock_port: ''
  ipv6: False
  errfile: False

  logger:
    outputs: [jsonl, scope]
    filter: 'score|length|fps|ratio|train/loss/|train/rand/'
    timer: True
    fps: 15
    user: ''

  env:
    atari: {size: [96, 96], repeat: 4, sticky: True, gray: True, actions: all, lives: unused, noops: 30, autostart: False, pooling: 2, aggregate: max, resize: pillow, clip_reward: False}
    procgen: {size: [96, 96], resize: pillow}
    crafter: {size: [64, 64], logs: False}
    atari100k: {size: [64, 64], repeat: 4, sticky: False, gray: False, actions: needed, lives: unused, noops: 30, autostart: False, resize: pillow, clip_reward: False}
    dmlab: {size: [64, 64], repeat: 4, episodic: True, use_seed: True}
    minecraft: {size: [64, 64], break_speed: 100.0, logs: False, length: 36000}
    dmc: {size: [64, 64], repeat: 1, proprio: True, image: True, camera: -1}
    loconav: {size: [64, 64], repeat: 1, camera: -1}
    drone:
      ctrl_freq: 30
      pyb_freq: 240
      episode_len_sec: 40
      goal_tolerance: 0.5
      randomize_goal: True
      randomize_start: True
      goal_sample_range: [11.7, 12.0, -7.5, 7.5, 0.6, 3.5]
      start_sample_range: [-12.0, -11.7, -7.5, 7.5, 0.8, 1.5]
      bounds: [-12.5, 12.5, -10.0, 10.0, 0.05, 4.5]
      map_range: [10.0, 10.0, 4.5]
      include_angular_velocity: False
      speed_limit: 2.0
      perception: flat
      lidar_hres_deg: 10.0
      lidar_vbeams: 4
      obstacles_enabled: True
      n_obstacles: 88
      collision_distance: 0.15
      path_clearance: 0.35
      path_cell_size: 0.25
      path_bounds_y: [-9.8, 9.8]
      eval_seed_base: 100000
      gui: False
      log_image: False
      video_every: 20
      use_index: True
      render_mode: 3d

  replay:
    size: 5e6
    online: True
    fracs: {uniform: 1.0, priority: 0.0, recency: 0.0}
    prio: {exponent: 0.8, maxfrac: 0.5, initial: inf, zero_on_sample: True}
    priosignal: model
    recexp: 1.0
    chunksize: 1024

  run:
    steps: 1e10
    duration: 0
    train_ratio: 32.0
    log_every: 120
    report_every: 300
    save_every: 900
    envs: 16
    eval_envs: 4
    eval_eps: 1
    report_batches: 1
    from_checkpoint: ''
    episode_timeout: 180
    actor_addr: 'localhost:{auto}'
    replay_addr: 'localhost:{auto}'
    logger_addr: 'localhost:{auto}'
    actor_batch: -1
    actor_threads: 1
    agent_process: False
    remote_replay: False
    remote_envs: False
    usage: {psutil: True, nvsmi: True, gputil: False, malloc: False, gc: False}
    debug: True

  jax:
    platform: cpu
    compute_dtype: bfloat16
    policy_devices: [0]
    train_devices: [0]
    mock_devices: 0
    prealloc: True
    jit: True
    debug: False
    profiler: False
    expect_devices: 0
    enable_policy: True
    coordinator_address: ''

  agent:
    loss_scales: {rec: 1.0, rew: 1.0, con: 1.0, dyn: 1.0, rep: 0.1, policy: 1.0, value: 1.0, repval: 0.3}
    opt: {lr: 4e-5, agc: 0.3, eps: 1e-20, beta1: 0.9, beta2: 0.999, momentum: True, wd: 0.0, schedule: const, warmup: 1000, anneal: 0}
    ac_grads: False
    dyn:
      typ: rssm
      rssm: {deter: 8192, hidden: 1024, stoch: 32, classes: 64, act: silu, norm: rms, unimix: 0.01, outscale: 1.0, winit: trunc_normal_in, imglayers: 2, obslayers: 1, dynlayers: 1, absolute: False, blocks: 8, free_nats: 1.0}
    enc:
      typ: simple
      simple: {depth: 64, mults: [2, 3, 4, 4], layers: 3, units: 1024, act: silu, norm: rms, winit: trunc_normal_in, symlog: True, outer: False, kernel: 5, strided: False, lidar_keys: '', lidar_depth: 48, lidar_layers: 3, lidar_kernel: 5, lidar_stride: 1, lidar_units: 512}
    dec:
      typ: simple
      simple: {depth: 64, mults: [2, 3, 4, 4], layers: 3, units: 1024, act: silu, norm: rms, outscale: 1.0, winit: trunc_normal_in, outer: False, kernel: 5, bspace: 8, strided: False}
    rewhead: {layers: 1, units: 1024, act: silu, norm: rms, output: symexp_twohot, outscale: 0.0, winit: trunc_normal_in, bins: 255}
    conhead: {layers: 1, units: 1024, act: silu, norm: rms, output: binary, outscale: 1.0, winit: trunc_normal_in}
    policy: {layers: 3, units: 1024, act: silu, norm: rms, minstd: 0.1, maxstd: 1.0, outscale: 0.01, unimix: 0.01, winit: trunc_normal_in}
    value: {layers: 3, units: 1024, act: silu, norm: rms, output: symexp_twohot, outscale: 0.0, winit: trunc_normal_in, bins: 255}
    policy_dist_disc: categorical
    policy_dist_cont: bounded_normal
    imag_last: 0
    imag_length: 15
    horizon: 333
    contdisc: True
    imag_loss: {slowtar: False, lam: 0.95, actent: 3e-4, slowreg: 1.0}
    repl_loss: {slowtar: False, lam: 0.95, slowreg: 1.0}
    slowvalue: {rate: 0.02, every: 1}
    retnorm: {impl: perc, rate: 0.01, limit: 1.0, perclo: 5.0, perchi: 95.0, debias: False}
    valnorm: {impl: none, rate: 0.01, limit: 1e-8}
    advnorm: {impl: none, rate: 0.01, limit: 1e-8}
    reward_grad: True
    repval_loss: True
    repval_grad: True
    report: True
    report_gradnorms: False

size1m: &size1m
  .*\.rssm: {deter: 512, hidden: 64, classes: 4}
  .*\.depth: 4
  .*\.units: 64

size12m: &size12m
  .*\.rssm: {deter: 2048, hidden: 256, classes: 16}
  .*\.depth: 16
  .*\.units: 256

size25m: &size25m
  .*\.rssm: {deter: 3072, hidden: 384, classes: 24}
  .*\.depth: 24
  .*\.units: 384

size50m: &size50m
  .*\.rssm: {deter: 4096, hidden: 512, classes: 32}
  .*\.depth: 32
  .*\.units: 512

size100m: &size100m
  .*\.rssm: {deter: 6144, hidden: 768, classes: 48}
  .*\.depth: 48
  .*\.units: 768

size200m: &size200m
  .*\.rssm: {deter: 8192, hidden: 1024, classes: 64}
  .*\.depth: 64
  .*\.units: 1024

size400m: &size400m
  .*\.rssm: {deter: 12288, hidden: 1536, classes: 96}
  .*\.depth: 96
  .*\.units: 1536

minecraft:
  task: minecraft_diamond

dmlab:
  task: dmlab_explore_goal_locations_small
  run: {steps: 2.6e7, train_ratio: 32}

atari:
  task: atari_pong
  run: {steps: 5.1e7, train_ratio: 32}

procgen:
  task: procgen_coinrun
  run: {steps: 1.1e8, train_ratio: 64}

atari100k:
  task: atari100k_pong
  run: {steps: 1.1e5, envs: 1, train_ratio: 256}

crafter:
  task: crafter_reward
  run: {steps: 1.1e6, envs: 1, train_ratio: 512}

dmc_proprio:
  <<: *size1m
  task: dmc_walker_walk
  env.dmc.image: False
  run: {steps: 1.1e6, train_ratio: 1024}

dmc_vision:
  task: dmc_walker_walk
  env.dmc.proprio: False
  run: {steps: 1.1e6, train_ratio: 256}

drone_nav:
  <<: *size12m
  task: drone_nav
  script: train_eval
  logger.filter: 'score|length|fps|ratio|train/loss/|success|collision|crash|timeout|distance|lidar'
  run: {steps: 5e6, envs: 8, eval_envs: 4, eval_eps: 20, train_ratio: 512}

# Drone navigation feasibility ablations. Always combine exactly one of these
# with `drone_nav`, for example: `--configs drone_nav drone_ablation_a`.
#
# The agent architecture, optimizer, replay, train ratio, control frequency,
# and total environment-step budget intentionally stay identical across A-D.
# Only task geometry/difficulty changes, so differences in learning curves can
# be attributed to the environment rather than to a larger model or more data.
drone_ablation_a:
  # Basic flight and goal reaching: 4-6 m, no obstacles.
  seed: 0
  env.drone:
    episode_len_sec: 15
    goal_sample_range: [2.0, 3.0, -1.5, 1.5, 0.8, 1.5]
    start_sample_range: [-3.0, -2.0, -1.5, 1.5, 0.8, 1.5]
    bounds: [-3.5, 3.5, -3.0, 3.0, 0.05, 3.0]
    map_range: [2.0, 2.0, 3.0]
    obstacles_enabled: False
    n_obstacles: 0
    eval_seed_base: 110000
  run: {steps: 5e6, envs: 8, eval_envs: 16, eval_eps: 64, train_ratio: 512}

drone_ablation_b:
  # Local obstacle avoidance: 8-10 m, 16 sparse obstacles.
  seed: 0
  env.drone: &drone_b_env
    episode_len_sec: 20
    goal_sample_range: [4.0, 5.0, -2.5, 2.5, 0.8, 2.0]
    start_sample_range: [-5.0, -4.0, -2.5, 2.5, 0.8, 1.5]
    bounds: [-5.5, 5.5, -4.5, 4.5, 0.05, 3.5]
    map_range: [3.8, 3.8, 3.5]
    obstacles_enabled: True
    n_obstacles: 16
    collision_distance: 0.15
    path_clearance: 0.35
    path_cell_size: 0.25
    path_bounds_y: [-4.3, 4.3]
    eval_seed_base: 120000
  run: &drone_b_run {steps: 5e6, envs: 8, eval_envs: 16, eval_eps: 64, train_ratio: 512}

drone_ablation_c:
  # Medium-range planning: 14-16 m, 40 obstacles.
  seed: 0
  env.drone:
    episode_len_sec: 30
    goal_sample_range: [7.0, 8.0, -5.0, 5.0, 0.8, 2.8]
    start_sample_range: [-8.0, -7.0, -5.0, 5.0, 0.8, 1.5]
    bounds: [-8.5, 8.5, -7.0, 7.0, 0.05, 4.0]
    map_range: [6.8, 6.8, 4.0]
    obstacles_enabled: True
    n_obstacles: 40
    path_bounds_y: [-6.8, 6.8]
    eval_seed_base: 130000
  run: {steps: 5e6, envs: 8, eval_envs: 16, eval_eps: 64, train_ratio: 512}

drone_ablation_d:
  # Full task: about 24 m, 88 dense obstacles (the current target task).
  seed: 0
  env.drone:
    episode_len_sec: 40
    goal_sample_range: [11.7, 12.0, -7.5, 7.5, 0.6, 3.5]
    start_sample_range: [-12.0, -11.7, -7.5, 7.5, 0.8, 1.5]
    bounds: [-12.5, 12.5, -10.0, 10.0, 0.05, 4.5]
    map_range: [10.0, 10.0, 4.5]
    obstacles_enabled: True
    n_obstacles: 88
    path_bounds_y: [-9.8, 9.8]
    eval_seed_base: 140000
  run: {steps: 5e6, envs: 8, eval_envs: 16, eval_eps: 64, train_ratio: 512}

# Perception-encoding ablations. Always combine exactly one of these with
# `drone_nav`, for example: `--configs drone_nav drone_perc_cnn`. All three run
# on the ablation-B task tier (8-10 m crossing, 16 obstacles, 3.8x3.8 field --
# the ~80% success regime) via the shared `drone_b_env` / `drone_b_run` anchors,
# so only the LiDAR encoding differs and gains are attributable to perception.
#
#   drone_perc_flat   -> state + flattened LiDAR, one shared MLP (baseline),
#                        10 deg x 4 layers = 144 beams.
#   drone_perc_cnn    -> state through the MLP, LiDAR through a dedicated 1D
#                        circular convolution branch, same 10 deg x 4 = 144
#                        beams as the baseline (isolates the encoding change).
#   drone_perc_cnn_az -> split CNN encoding with azimuth-only densification
#                        (5 deg x 4 layers = 288): doubles horizontal resolution
#                        while keeping elevation fixed, so gains are attributable
#                        to azimuth density specifically.
#   drone_perc_cnn_hi -> split CNN encoding with both axes densified
#                        (5 deg x 8 layers = 576): tests how the convolutional
#                        branch scales with the full higher-dimensional LiDAR.
#
# Capacity in the split variants is asymmetric on purpose: the 9-dim
# deterministic state gets a small MLP (2 x 128), while the higher-complexity
# LiDAR gets a deeper conv (depth 64) that also strides down the azimuth axis so
# the feature capacity lives in the convolution rather than in a giant flatten
# ->Linear (and stays comparable across resolutions). Both branches are
# projected to a fixed 512-dim embedding; the RSSM then fuses them to `hidden`.
# The split variants share identical encoder capacity; only the LiDAR resolution
# (env.drone.lidar_hres_deg / lidar_vbeams) differs across cnn / cnn_az / cnn_hi.
drone_perc_flat:
  seed: 0
  env.drone:
    <<: *drone_b_env
    perception: flat
    lidar_hres_deg: 10.0
    lidar_vbeams: 4
  run: *drone_b_run

drone_perc_cnn:
  seed: 0
  env.drone:
    <<: *drone_b_env
    perception: split
    lidar_hres_deg: 10.0
    lidar_vbeams: 4
  run: *drone_b_run
  agent.enc.simple:
    units: 128
    layers: 2
    lidar_keys: '^lidar$'
    lidar_depth: 64
    lidar_stride: 2
    lidar_units: 512

drone_perc_cnn_az:
  seed: 0
  env.drone:
    <<: *drone_b_env
    perception: split
    lidar_hres_deg: 5.0
    lidar_vbeams: 4
  run: *drone_b_run
  agent.enc.simple:
    units: 128
    layers: 2
    lidar_keys: '^lidar$'
    lidar_depth: 64
    lidar_stride: 2
    lidar_units: 512

drone_perc_cnn_hi:
  seed: 0
  env.drone:
    <<: *drone_b_env
    perception: split
    lidar_hres_deg: 5.0
    lidar_vbeams: 8
  run: *drone_b_run
  agent.enc.simple:
    units: 128
    layers: 2
    lidar_keys: '^lidar$'
    lidar_depth: 64
    lidar_stride: 2
    lidar_units: 512

# Safety-balanced reward for post-perception training. Apply this preset last so
# task geometry and encoder settings remain unchanged. Examples:
#   B + CNN-AZ: --configs drone_nav drone_perc_cnn_az drone_reward_v2
#   C + CNN-AZ: --configs drone_nav drone_perc_cnn_az drone_ablation_c drone_reward_v2
# Keeping this separate preserves the original reward/perception baselines.
drone_reward_v2:
  env.drone:
    reward_cfg:
      progress: 3.0
      goal_bonus: 60.0
      time_penalty: 0.005
      timeout_penalty: 15.0
      crash_penalty: 60.0
      collision_penalty: 60.0
      obstacle_proximity: 0.05
      safety_margin: 0.6

bsuite:
  task: bsuite_mnist/0
  run: {envs: 1, save_every: -1, train_ratio: 1024}

loconav:
  task: loconav_ant_maze_m
  env.loconav.repeat: 1
  run.train_ratio: 256

multicpu:
  batch_size: 12
  jax.mock_devices: 8
  jax.policy_devices: [0, 1]
  jax.train_devices: [2, 3, 4, 5, 6, 7]

debug:
  batch_size: 8
  batch_length: 10
  report_length: 5
  jax: {platform: cpu, debug: True, prealloc: False}
  run: {envs: 4, report_every: 10, log_every: 5, save_every: 15, train_ratio: 8, debug: True}
  replay.size: 1e4
  agent:
    .*\.bins: 5
    .*\.layers: 1
    .*\.units: 8
    .*\.stoch: 2
    .*\.classes: 4
    .*\.deter: 8
    .*\.hidden: 3
    .*\.blocks: 4
    .*\.depth: 2
